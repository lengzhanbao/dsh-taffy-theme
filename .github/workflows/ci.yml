name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify + test + pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/ci-requirements.txt

      - name: Install Python asset-gate deps
        run: pip install -r scripts/ci-requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run ci

      # `lib/` is committed, so a source change that was never rebuilt would
      # otherwise ship stale code. build:ci needs no DSH checkout and no mklink,
      # so the rebuild can be diffed against the committed output.
      - name: Build drift
        run: |
          npm run build:ci
          git diff --exit-code -- lib src/client/theme-css.ts
